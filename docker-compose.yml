version: "3.8"
services:
  tensorflow:
    #image: nvcr.io/nvidia/tensorflow:23.03-tf1-py3
    image: lanenet:latest
    command: bash
    volumes:
      - /home/zyb/lanenet-lane-detection:/app
    ports:
      - 6006:6006
    environment:
      - PYTHONPATH=/app
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    stdin_open: true   # equivalent to -i
    tty: true          # equivalent to -t

